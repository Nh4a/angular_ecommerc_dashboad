  <!-- Header (Fixed Top) -->
  <header class="flex items-center justify-between gap-2 sm:gap-4 flex-wrap sm:flex-nowrap shrink-0">
    <div class="flex items-center gap-3 sm:gap-6 pl-1">
      <div class="w-9 h-9 sm:w-10 sm:h-10 bg-black rounded-full flex items-center justify-center text-white shrink-0">
        <svg class="w-4 h-4 sm:w-5 sm:h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 3v18M3 12h18"/>
        </svg>
      </div>
      <h1 class="text-xl sm:text-2xl font-bold text-gray-900 tracking-tight">PuNha</h1>
    </div>

    <div class="flex items-center gap-2 sm:gap-4 ml-auto sm:ml-0">
      <div class="relative hidden sm:block w-48 md:w-64 lg:w-80">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
        <input type="text" placeholder="Search anything..." class="w-full bg-white pl-10 pr-4 py-2 sm:py-2.5 rounded-full text-sm text-gray-700 placeholder-gray-400 focus:outline-none shadow-sm">
      </div>

      <button class="bg-[#1e1e1e] hover:bg-black text-white px-4 sm:px-5 py-2 sm:py-2.5 rounded-full text-xs sm:text-sm font-medium transition-all">
        Create
      </button>

      <button class="w-9 h-9 sm:w-10 sm:h-10 bg-white rounded-full flex items-center justify-center text-gray-600 hover:text-black shadow-sm transition-all">
        <i class="fa-regular fa-bell text-xs sm:text-sm"></i>
      </button>
      <button class="w-9 h-9 sm:w-10 sm:h-10 bg-white rounded-full flex items-center justify-center text-gray-600 hover:text-black shadow-sm transition-all hidden xs:flex">
        <i class="fa-regular fa-comment-dots text-xs sm:text-sm"></i>
      </button>

      <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-full overflow-hidden ml-1 sm:ml-2 cursor-pointer ring-2 ring-transparent hover:ring-gray-300 transition-all shrink-0">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" alt="Profile" class="w-full h-full object-cover">
