<div class="flex min-h-screen items-center justify-center bg-gray-100 p-4 sm:p-6 lg:p-8 font-sans text-gray-800">
  <div class="w-full max-w-md rounded-2xl sm:rounded-3xl bg-white p-6 sm:p-10 shadow-sm">

    <div class="flex items-center gap-2">
      <div class="flex h-7 w-7 items-center justify-center rounded-full bg-black text-white">
        <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2a10 10 0 100 20 10 10 0 000-20zm0 18a8 8 0 110-16 8 8 0 010 16z"/>
        </svg>
      </div>
      <span class="text-lg font-bold tracking-tight text-black">PU-NHA</span>
    </div>



    <div class="mt-8 space-y-4 sm:space-y-5" action="#" method="POST">
      <div>
        <label class="mb-1.5 block text-xs font-semibold text-gray-700">Email</label>
        <input
          [(ngModel)]="email"
          type="email"
          placeholder="hello@mail.com"
          required
          class="w-full rounded-xl border border-gray-200 px-3.5 py-2.5 sm:px-4 sm:py-3 text-xs sm:text-sm text-gray-800 placeholder-gray-400 transition focus:border-gray-900 focus:outline-none focus:ring-1 focus:ring-gray-900"
        />
      </div>

      <div>
        <label class="mb-1.5 block text-xs font-semibold text-gray-700">Password</label>
        <input
          [(ngModel)]="password"
          type="password"
          placeholder="Password"
          required
          class="w-full rounded-xl border border-gray-200 px-3.5 py-2.5 sm:px-4 sm:py-3 text-xs sm:text-sm text-gray-800 placeholder-gray-400 transition focus:border-gray-900 focus:outline-none focus:ring-1 focus:ring-gray-900"
        />
      </div>

      <div>
        <p class="text-center text-red-500 underline ">{{authService.message()}}</p>
      </div>
      <button
        type="submit"
        (click)="submit(); ut.stopPrevent($event)"
        class=" w-full  rounded-xl bg-slate-800 py-2.5 sm:py-3 text-xs sm:text-sm font-semibold text-white shadow-sm transition hover:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:ring-offset-2 active:scale-[0.99]"
      >
        Login
      </button>
    </div>
  </div>
</div>
