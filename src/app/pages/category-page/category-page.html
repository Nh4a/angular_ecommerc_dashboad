<div class="w-full h-full min-h-[500px] flex flex-col gap-5 font-['Inter'] text-gray-900">
  <!-- Header -->
  <section
    class="w-full shrink-0 bg-white border border-gray-100 rounded-2xl p-5 sm:p-6 shadow-[0_2px_10px_rgba(0,0,0,0.03)]"
  >
    <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-5">
      <!-- Title -->
      <div>
        <div class="flex items-center gap-2 mb-1">
          <h2 class="text-xl font-semibold tracking-tight text-gray-900">Categories</h2>

          <span class="px-2 py-0.5 rounded-md bg-gray-100 text-gray-500 text-[10px] font-semibold">
            12
          </span>
        </div>

        <p class="text-sm text-gray-500">Organize and manage your product categories.</p>
      </div>

      <!-- Actions -->
      <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
        <!-- Search -->
        <div class="relative w-full sm:w-64">
          <i
            class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs"
          ></i>

          <input
            type="text"
            placeholder="Search categories..."
            class="w-full h-10 bg-gray-50 border border-gray-200 pl-10 pr-4 rounded-xl text-sm text-gray-700 placeholder:text-gray-400 outline-none transition-all focus:bg-white focus:border-gray-400 focus:ring-2 focus:ring-gray-100"
          />
        </div>

        <!-- Add Button -->
        <button
          type="button"
          class="h-10 px-4 rounded-xl bg-gray-900 hover:bg-black text-white text-sm font-medium flex items-center justify-center gap-2 transition-all shadow-sm hover:shadow-md active:scale-[0.98]"
        >
          <i class="fa-solid fa-plus text-xs"></i>

          <span>Add Category</span>
        </button>
      </div>
    </div>
  </section>

  <!-- Table Card -->
  <section
    class="w-full flex-1 min-h-0 bg-white border border-gray-100 rounded-2xl shadow-[0_2px_10px_rgba(0,0,0,0.03)] overflow-hidden flex flex-col"
  >
    <!-- Table Area -->
    <div class="flex-1 min-h-0 overflow-auto">
      <table class="w-full text-left border-collapse">
        <!-- Table Head -->
        <thead class="sticky top-0 z-10">
          <tr
            class="bg-gray-50/95 border-b border-gray-100 text-[11px] text-gray-400 uppercase tracking-wider"
          >
            <th class="px-6 py-4 font-semibold">Category</th>

            <th class="px-4 py-4 font-semibold">Slug</th>

            <th class="px-4 py-4 font-semibold">Products</th>

            <th class="px-4 py-4 font-semibold">Status</th>

            <th class="px-6 py-4 font-semibold text-right">Actions</th>
          </tr>
        </thead>

        <!-- Table Body -->
        <tbody class="divide-y divide-gray-100">
          <!-- Row 1 -->
          <tr class="group hover:bg-gray-50/60 transition-colors">
            <!-- Category -->
            <td class="px-6 py-4">
              <div class="flex items-center gap-3">
                <div
                  class="w-10 h-10 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center shrink-0"
                >
                  <i class="fa-solid fa-palette text-sm"></i>
                </div>

                <div>
                  <p class="text-sm font-semibold text-gray-900">UI Kits</p>

                  <p class="text-xs text-gray-400 mt-0.5">Design Assets</p>
                </div>
              </div>
            </td>

            <!-- Slug -->
            <td class="px-4 py-4">
              <span class="text-xs font-medium text-gray-500"> ui-kits </span>
            </td>

            <!-- Products -->
            <td class="px-4 py-4">
              <span class="text-sm font-semibold text-gray-900"> 142 </span>
            </td>

            <!-- Status -->
            <td class="px-4 py-4">
              <span
                class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-600 text-[11px] font-semibold"
              >
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>

                Active
              </span>
            </td>

            <!-- Actions -->
            <td class="px-6 py-4">
              <div class="relative flex justify-end group">
                <!-- Action Button -->
                <button
                  type="button"
                  class="h-9 px-3 rounded-lg border border-gray-200 bg-white text-gray-600 hover:bg-gray-50 hover:text-gray-900 text-xs font-medium flex items-center gap-2 transition-all"
                >
                  <span>Actions</span>

                  <i
                    class="fa-solid fa-chevron-down text-[9px] transition-transform duration-200 group-hover:rotate-180"
                  ></i>
                </button>

                <!-- Dropdown -->
                <div
                  class=" absolute  right-0 top-full mt-2 w-40 bg-white border border-gray-100 rounded-xl shadow-lg p-1.5 z-500 opacity-0 invisible translate-y-1 group-hover:opacity-100 group-hover:visible group-hover:translate-y-0 transition-all duration-200"
                >
                  <!-- View -->
                  <button
                    type="button"
                    class="w-full px-3 py-2 rounded-lg flex items-center gap-3 text-xs text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition-colors"
                  >
                    <i class="fa-regular fa-eye w-4 text-center"></i>

                    <span>View</span>
                  </button>

                  <!-- Edit -->
                  <button
                    type="button"
                    class="w-full px-3 py-2 rounded-lg flex items-center gap-3 text-xs text-gray-600 hover:bg-blue-50 hover:text-blue-600 transition-colors"
                  >
                    <i class="fa-regular fa-pen-to-square w-4 text-center"></i>

                    <span>Edit</span>
                  </button>

                  <!-- Divider -->
                  <div class="my-1 border-t border-gray-100"></div>

                  <!-- Delete -->
                  <button
                    type="button"
                    class="w-full px-3 py-2 rounded-lg flex items-center gap-3 text-xs text-rose-500 hover:bg-rose-50 hover:text-rose-600 transition-colors"
                  >
                    <i class="fa-regular fa-trash-can w-4 text-center"></i>

                    <span>Delete</span>
                  </button>
                </div>
              </div>
            </td>
          </tr>

        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div
      class="shrink-0 px-6 py-4 border-t border-gray-100 flex flex-col sm:flex-row items-center justify-between gap-4"
    >
      <p class="text-xs text-gray-500">
        Showing
        <span class="font-semibold text-gray-700">1–4</span>
        of
        <span class="font-semibold text-gray-700">12</span>
        categories
      </p>

      <div class="flex items-center gap-1.5">
        <button
          disabled
          class="w-8 h-8 rounded-lg border border-gray-200 text-gray-300 flex items-center justify-center"
        >
          <i class="fa-solid fa-chevron-left text-[10px]"></i>
        </button>

        <button
          class="w-8 h-8 rounded-lg bg-gray-900 text-white text-xs font-semibold flex items-center justify-center shadow-sm"
        >
          1
        </button>

        <button
          class="w-8 h-8 rounded-lg text-gray-500 hover:bg-gray-100 hover:text-gray-900 text-xs font-medium flex items-center justify-center transition-all"
        >
          2
        </button>

        <button
          class="w-8 h-8 rounded-lg border border-gray-200 text-gray-500 hover:border-gray-400 hover:text-gray-900 flex items-center justify-center transition-all"
        >
          <i class="fa-solid fa-chevron-right text-[10px]"></i>
        </button>
      </div>
    </div>
  </section>
</div>
