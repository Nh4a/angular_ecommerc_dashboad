<div (click)="ut.stopPropagation($event)" class="relative bg-white  rounded-lg  shadow-xl w-full min-w-sm overflow-hidden flex flex-col z-200 drop-shadow-2xl">
<!--  loading-->
  @if(categoryService.isModifying()){
    <div class="absolute flex items-center justify-center h-full w-full backdrop-blur-sm">
      <div class="w-12 h-12 border-4 border-slate-300 border-t-slate-500 rounded-full animate-spin"></div>
    </div>
  }
  <div class="pt-6 pb-2 px-6">
    <h2 class="text-xl font-semibold text-gray-800 text-center">{{category._id?'Update Category':'Add New Category'}}</h2>
  </div>

  <form  class="p-6 space-y-5">

    <div class="space-y-1">
<!--  name    -->
      <label for="name" class="block text-xs font-semibold text-gray-600">Name</label>
      <input
        id="name"
        name="name"
        type="text"
        [(ngModel)]="category.name"
        class="w-full px-3 py-2 text-sm text-gray-800 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
      />
    </div>

    <div class="space-y-1">
<!--      description-->
      <label for="description" class="block text-xs font-semibold text-gray-600">Description</label>
      <textarea
        id="description"
        name="description"
        rows="3"
        [(ngModel)]="category.description"
        class="w-full px-3 py-2 text-sm text-gray-800 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"
      ></textarea>
    </div>

    <div class="space-y-1">
      <label class="block text-xs font-semibold text-gray-600">Status</label>
      <div class="flex items-center space-x-6 pt-1">
        <label class="flex items-center space-x-2 cursor-pointer">
          <input
            type="radio"
            name="status"
            [value]="true"
            class="w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500"
            [(ngModel)]="category.status"
          />
          <span class="text-sm font-medium text-gray-700">Active</span>
        </label>

        <label class="flex items-center space-x-2 cursor-pointer">
          <input
            type="radio"
            name="status"
            [value]="false"
            class="w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500"
            [(ngModel)]="category.status"
          />
          <span class="text-sm font-medium text-gray-700">Inactive</span>
        </label>
      </div>
    </div>

    <div class="pt-4 flex items-center justify-end space-x-3 border-t border-gray-100">
      <button
        (click)="emitCancel()"
        type="button"
        class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors shadow-sm"
      >
        Cancel
      </button>
      <button
        (click)="ut.stopPrevent($event); emitSave()"
        type="submit"
        class="px-4 py-2 text-sm font-medium text-white bg-blue-600 border border-transparent rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors shadow-sm"
      >
        Save Changes
      </button>
    </div>

  </form>
</div>
