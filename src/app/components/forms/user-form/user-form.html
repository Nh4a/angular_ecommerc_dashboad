<div
  (click)="ut.stopPropagation($event)"
  class="relative bg-white rounded-lg shadow-xl w-full min-w-sm overflow-hidden flex flex-col z-200 drop-shadow-2xl"
>
  <!--  loading-->
  @if (userService.isModifying()) {
    <div class="absolute flex items-center justify-center h-full w-full backdrop-blur-sm">
      <div
        class="w-12 h-12 border-4 border-slate-300 border-t-slate-500 rounded-full animate-spin"
      ></div>
    </div>
  }
  <div class="pt-6 pb-2 px-6">
    <h2 class="text-xl font-semibold text-gray-800 text-center">
      {{ User?._id ? 'Update User' : 'Add New User' }}
    </h2>
  </div>

  <form class="p-6 space-y-5">
    <div class="space-y-1">
      <!--  name    -->
      <label for="name" class="block text-xs font-semibold text-gray-600">User Name</label>
      <input
        [(ngModel)]="User.name"
        id="name"
        name="name"
        type="text"
        required
        class="w-full px-3 py-2 text-sm text-gray-800 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
      />
    </div>

    <div class="space-y-1">
      <!--      Email-->
      <label for="email" class="block text-xs font-semibold text-gray-600">Email</label>
      <input
        [(ngModel)]="User.email"
        id="email"
        name="email"
        type="email"
        required
        class="w-full px-3 py-2 text-sm text-gray-800 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
      />
    </div>
    <!--  password  -->
    @if(!User._id){
      <div class="space-y-1">
        <!--      Email-->
        <label for="pw" class="block text-xs font-semibold text-gray-600">Password</label>
        <input
          [(ngModel)]="User.password"
          id="pw"
          name="password"
          type="password"
          placeholder="User password"
          required
          class="w-full px-3 py-2 text-sm text-gray-800 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        />
      </div>
    }



    <div class="space-y-1">
      <!--      role-->
      <label for="role" class="block text-xs font-semibold text-gray-600">Role</label>
      <select
        [(ngModel)]="User.role"
        name="role"
        id="role"
        class="w-full px-3 py-2 text-sm text-gray-800 border border-gray-300 rounded-md"
      >
        <option value="admin">Admin</option>
        <option value="user">User</option>
      </select>
    </div>

    <div class="space-y-1">
      <label class="block text-xs font-semibold text-gray-600">Status</label>
      <div class="flex items-center space-x-6 pt-1">
        <label class="flex items-center space-x-2 cursor-pointer">
          <input
            type="radio"
            name="status"
            [value]="true"
            [(ngModel)]="User.isActive"
            class="w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500"
          />
          <span class="text-sm font-medium text-gray-700">Active</span>
        </label>

        <label class="flex items-center space-x-2 cursor-pointer">
          <input
            type="radio"
            name="status"
            [value]="false"
            [(ngModel)]="User.isActive"
            class="w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500"
          />
          <span class="text-sm font-medium text-gray-700">Inactive</span>
        </label>
      </div>
    </div>

    <!--message error-->
    <div class="space-y-1 h-[12px]">
      <p class="text-center text-[14px] font-medium text-red-500">{{ message }}</p>
    </div>

    <div class="pt-4 flex items-center justify-end space-x-3 border-t border-gray-100">
      <button
        type="button"
        class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors shadow-sm"
        (click)="onCancel.emit()"
      >
        Cancel
      </button>
      <button
        type="submit"
        (click)="ut.stopPrevent($event); onSave.emit()"
        class="px-4 py-2 text-sm font-medium text-white bg-blue-600 border border-transparent rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors shadow-sm"
      >
        Save Changes
      </button>
    </div>
  </form>
</div>
